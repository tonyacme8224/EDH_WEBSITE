[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/inquiries/*"
  to = "/.netlify/functions/submit-inquiry"
  status = 200

[[redirects]]
  from = "/api/inquiries"
  to = "/.netlify/functions/submit-inquiry"
  status = 200

[[redirects]]
  from = "/api/admin/login"
  to = "/.netlify/functions/get-inquiries"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
